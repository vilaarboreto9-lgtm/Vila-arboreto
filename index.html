<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vila Arboreto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0b3d24">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;--g:#0b3d24;--g2:#14573a;--au:#c9a227;--au2:#ecd27a;--au3:#a8851a;--bg:#f6f5f0;--tx:#1c2b22;--mu:#5d6b62;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:var(--g);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--au);outline-offset:2px}
.hdr{background:linear-gradient(160deg,#06281a,var(--g) 60%,var(--g2));color:var(--au2);padding:10px 14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--au);border-radius:0 0 50% 50%/0 0 14px 14px}
.hdr .ic{background:none;border:0;color:var(--au2);font-size:24px;width:64px;text-align:left}
.hdr .who{width:64px;text-align:center;font-size:11px;line-height:1.2;border:0;background:none;color:var(--au2)}
.hdr .who b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 2px;border:1.5px solid var(--au2);border-radius:50%;font-size:16px}
.brand{text-align:center;line-height:1}
.brand small{display:block;font-size:9px;letter-spacing:.35em;margin-top:3px}
.brand .v{font-size:11px;letter-spacing:.3em}
.brand .a{font-size:26px;letter-spacing:.04em}
main{flex:1;overflow-y:auto;padding:14px 14px 18px}
.hero{text-align:center;margin:4px 0 14px}
.hero .ring{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;border:3px solid var(--au);display:grid;place-items:center;font-size:30px;background:#fff}
.hero h1{margin:0;font-size:34px;color:var(--g)}
.hero p{margin:2px 0 0;font-size:11px;letter-spacing:.2em;color:var(--mu);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid var(--au);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;box-shadow:0 2px 8px rgba(11,61,36,.12)}
.card .e{font-size:30px}
.card h3{margin:0;font-size:17px;color:var(--g)}
.card p{margin:0;font-size:12.5px;color:var(--mu);line-height:1.35}
.card.red{background:linear-gradient(150deg,#b3151b,#7d0b10);border-color:#e8a0a3;color:#fff}
.card.red h3,.card.red p{color:#fff}
.nav{display:flex;background:linear-gradient(#f0d77a,var(--au) 55%,var(--au3));border-top:2px solid var(--au3);padding:6px 4px}
.nav button{flex:1;background:none;border:0;border-radius:12px;padding:6px 2px;font-size:11px;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.nav button span{font-size:20px}
.nav button.on{background:var(--g);color:var(--au2)}
.back{background:none;border:0;color:var(--g);font-size:14px;padding:4px 0;margin-bottom:6px}
h2{margin:0 0 10px;font-size:24px;color:var(--g)}
.box{background:#fff;border:1px solid #e3dcc0;border-radius:14px;padding:12px;margin-bottom:10px}
.box h4{margin:0 0 4px;font-size:15px}
.box p,.box small{margin:0;font-size:13px;color:var(--mu);line-height:1.4}
label{display:block;font-size:13px;margin:8px 0 3px;color:var(--mu)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfc7a6;border-radius:10px;background:#fff}
.gold{width:100%;margin-top:12px;padding:12px;border:1px solid var(--au3);border-radius:30px;background:linear-gradient(#f3dd88,var(--au) 55%,var(--au3));color:var(--g);font-weight:700;font-size:16px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee7cf;font-size:15px}
.stat:last-child{border:0}
details{background:#fff;border:1px solid #e3dcc0;border-radius:14px;padding:12px;margin-bottom:8px}
summary{font-weight:700;color:var(--g);cursor:pointer}
details p{margin:8px 0 0;font-size:14px;color:var(--mu);line-height:1.45}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
.chk input{width:20px;height:20px}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:10px}
.sp{height:100%;display:flex;flex-direction:column}
.sp .top{background:linear-gradient(160deg,#06281a,var(--g));color:var(--au2);text-align:center;padding:34px 20px 54px;border-bottom:4px solid var(--au);border-radius:0 0 50% 50%/0 0 26px 26px}
.sp .top .a{font-size:44px;letter-spacing:.03em;line-height:1}
.sp .top .v{font-size:17px;letter-spacing:.4em}
.sp .top small{display:block;font-size:11px;letter-spacing:.5em;margin-top:8px}
.sp .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 28px}
.sp .mid .gold{display:flex;align-items:center;gap:14px;justify-content:center;font-size:21px;font-weight:400;padding:16px;margin:0}
.sp .bot{height:70px;background:linear-gradient(160deg,var(--g2),#06281a);border-top:4px solid var(--au);border-radius:50% 50% 0 0/26px 26px 0 0}
.fab{position:absolute;right:18px;bottom:88px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:34px;line-height:1;color:var(--g);background:linear-gradient(#f3dd88,var(--au) 55%,var(--au3));border:2px solid var(--au3);box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:5}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.vrow{width:100%;text-align:left;display:block;color:var(--g);font-size:15px}
.mb{max-width:88%;margin:8px 0;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4}.mb.u{margin-left:auto;background:var(--g);color:var(--au2);border-bottom-right-radius:4px}.mb.a{background:#fff;border:1px solid var(--au);border-bottom-left-radius:4px}.mb small{display:block;color:var(--au3);font-weight:700;margin-bottom:2px}
.abar{position:sticky;bottom:-12px;display:flex;gap:6px;align-items:center;background:var(--bg);padding:10px 0 4px}.abar input{flex:1;min-width:0;border-radius:24px}.abar button{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--au3);background:linear-gradient(#f3dd88,var(--au));font-size:20px;padding:0}.abar .mic.on{background:#d8262d}
.rt{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#14573a,#06281a 70%);color:var(--au2);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;font-family:Georgia,serif;overflow-y:auto}
.rtx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:none;border:1px solid var(--au2);color:var(--au2);width:38px;height:38px;border-radius:50%;font-size:18px}
.rt .s{max-width:420px;width:100%;animation:rin 1.1s ease both}.rt h1{font-size:40px;margin:8px 0}.rt h2{font-size:26px;margin:6px 0}.rt p{font-size:17px;line-height:1.5;opacity:.92}.rt .n{font-size:96px;line-height:1;color:#f3dd88}.rt .rtk{letter-spacing:.35em;font-size:12px}.rt .msg{font-size:21px;line-height:1.55}.rt .sig{margin-top:14px;color:var(--au)}
@keyframes rin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rt .clip{width:100%;max-height:46vh;object-fit:cover;border-radius:16px;border:2px solid var(--au);background:#000;margin:10px 0}.rt ul{list-style:none;padding:0;margin:12px 0 0;font-size:16px;line-height:1.7;opacity:.95}
.tvb{background:linear-gradient(150deg,var(--g2),var(--g));color:var(--au2)}.tvb button{color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 11px;border:1px solid var(--au);border-radius:20px;background:#fff;font-size:13.5px;color:var(--g)}.chip.on{background:var(--g);color:var(--au2)}.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.ban{background:linear-gradient(150deg,#b3151b,#7d0b10);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}.ban b{display:block;font-size:15px}.ban small{opacity:.9}.ban button{background:#fff;color:#7d0b10;border:0;border-radius:16px;padding:6px 12px;font-weight:700}
.pri{color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;font-family:system-ui,sans-serif}
.frow{display:flex;align-items:center;gap:10px;justify-content:space-between}.frow>div{flex:1}.del{background:none;border:0;font-size:20px;padding:6px}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .25s ease-out}}
@keyframes in{from{opacity:.4}to{opacity:1}}

#gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;font-family:Georgia,serif}
#gate[hidden]{display:none}
.gbox{max-width:420px;margin:0 auto;min-height:100%}
.gtop{background:linear-gradient(160deg,#06281a,var(--g));color:var(--au2);text-align:center;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 44px;border-bottom:4px solid var(--au);border-radius:0 0 50% 50%/0 0 26px 26px;font-size:54px;line-height:1.1}
.gv{font-size:16px;letter-spacing:.4em}.ga2{font-size:36px;letter-spacing:.03em;line-height:1}.gtop small{display:block;font-size:11px;letter-spacing:.5em;margin-top:8px}
.gform{padding:18px 24px 30px}
.gb{width:100%;margin-top:14px;padding:13px;border:1px solid var(--au3);border-radius:30px;background:linear-gradient(#f3dd88,var(--au) 55%,var(--au3));color:var(--g);font-weight:700;font-size:16px}
.gl{display:block;width:100%;background:none;border:0;color:var(--g);padding:10px;font-size:14px;text-decoration:underline}
.gm{color:#b3151b;text-align:center;font-size:14px}.gn{text-align:center;color:var(--mu)}
</style>
</head>

<div id="app"></div>
<div id="gate"><div class="gbox"><div class="gtop">🌳</div><div class="gform"><p class="gn">Carregando…</p></div></div></div>
<script>
window.__fbp=new Promise(function(r){window.__fbres=r});
window.claude={use:function(n){return window.__fbp.then(function(api){return api[n]||null})}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
<script>

var app=document.getElementById('app');
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var st={role:null,sc:'splash',alert:0,cur:-1};
var D={
 vis:[{n:'Maria Souza',t:'Visita',d:'Hoje, 15h'}],
 ouv:[],vids:[],
 tasks:[{t:'Revisar contrato da portaria',ok:false},{t:'Agendar limpeza da caixa d’água',ok:true},{t:'Responder chamados da semana',ok:false}]
};
var MCARDS=[
 ['com','📢','Comunicados','Receba notícias, avisos e informações importantes do condomínio.'],
 ['acc','🚪','Controle de Acesso','Gerencie visitantes, prestadores e liberações de entrada.'],
 ['faq','📘','Manual do Morador','Regras, orientações e respostas para o dia a dia no condomínio.'],
 ['ouv','💬','Ouvidoria','Canal para sugestões, reclamações e solicitações dos moradores.'],
 ['tv','📺','TV Arboreto','Vídeos e novidades do condomínio.']];
var ACARDS=[
 ['fin','🧾','Gastos esporádicos','Compras do dia a dia e quanto tempo cada item dura.'],
 ['con','📒','Contatos de Prestadores e Fornecedores','Lista de empresas, serviços e fornecedores.'],
 ['fra','💡','Frases Motivacionais Diárias','Mensagens que inspiram um condomínio mais unido e feliz.'],
 ['tv','📺','TV Arboreto','Comunicados, notícias e entretenimento.'],
 ['pf','📘','Manual do Morador','Escreva as perguntas e respostas que os moradores vão encontrar.'],
 ['res','👥','Moradores','Moradores cadastrados, com bloco e apartamento.']];
var MNAV=[['mhome','Início','🏠'],['com','Comunicados','📢'],['acc','Controle de Acesso','🚪'],['faq','Manual','📘'],['ouv','Ouvidoria','💬']];
var ANAV=[['ass','Assistente','🎙️'],['age','Agenda','📅'],['tar','Tarefas','✅'],['adm','Administração','⚙️'],['aud','Auditoria','🔒']];
var TREE='<svg width="46" height="40" viewBox="0 0 46 40" aria-hidden="true"><g fill="#d9b73e"><ellipse cx="23" cy="9" rx="4" ry="7"/><ellipse cx="14" cy="14" rx="4" ry="6.5" transform="rotate(-40 14 14)"/><ellipse cx="32" cy="14" rx="4" ry="6.5" transform="rotate(40 32 14)"/><ellipse cx="9" cy="23" rx="3.5" ry="6" transform="rotate(-65 9 23)"/><ellipse cx="37" cy="23" rx="3.5" ry="6" transform="rotate(65 37 23)"/><rect x="21.6" y="18" width="2.8" height="20" rx="1.4"/></g></svg>';
function head(){
 var who=st.role==='por'?'Portaria':st.role==='adm'?(st.user?st.user.nome:'Administrador'):(window.ME&&window.ME.nome?String(window.ME.nome).split(' ')[0]:'Morador');
 return '<header class="hdr"><button class="ic" data-go="'+(st.role==='adm'?'splash':st.role==='por'?'pacc':'mhome')+'" aria-label="Início">☰</button><div class="brand">'+TREE+'<span class="v">VILA</span><div class="a">ARBORETO</div><small>CONDOMÍNIO</small></div><button class="who" data-go="splash"><b>👤</b>Olá,<br>'+who+' ▾</button></header>';
}
function cards(list){
 return '<div class="grid">'+list.map(function(c){
  return '<button class="card'+(c[0]==='ale'?' red':'')+'" data-go="'+c[0]+'"><span class="e">'+c[1]+'</span><h3>'+c[2]+'</h3><p>'+c[3]+'</p></button>';
 }).join('')+'</div>';
}
function hero(ic,t,s){return '<div class="hero"><div class="ring">'+ic+'</div><h1>'+t+'</h1><p>'+s+'</p></div>'}
function back(){return '<button class="back" data-go="'+(st.role==='adm'?'adm':st.role==='por'?'pchat':'mhome')+'">‹ Voltar</button>'}
function box(h,p,s){return '<div class="box"><h4>'+h+'</h4><p>'+p+'</p>'+(s?'<small>'+s+'</small>':'')+'</div>'}
function body(){
 var s=st.sc,h='';
 if(s==='faq')return faqView();
 if(s==='acc')return accView();
 if(s==='pacc')return paccView();
 if(s==='pval')return pvalView();
 if(s==='pchat')return pchatView();
 if(s==='pthread')return pthreadView();
 if(s==='pf')return pfView();
 if(s==='res')return resView();
 if(s==='mhome')return hero('🏠','Moradores','Facilidades e serviços para o seu dia a dia')+cards(MCARDS);
 if(s==='adm')return hero('⚙️','Administração','Gestão para um condomínio ainda melhor')+cards(ACARDS);
 if(s==='com')return '<h2>Comunicados</h2>'+box('Manutenção do elevador – Bloco B','Na quinta-feira, das 9h às 12h, o elevador ficará parado para revisão.','Publicado hoje')+box('Assembleia geral ordinária','Sábado, às 19h, no salão de festas. Sua presença é importante.','Publicado ontem')+box('Coleta seletiva','A coleta de recicláveis passa às terças e sextas pela manhã.','Há 3 dias')+'<p class="note">Avisos de exemplo para testar o layout.</p>';
 if(s==='acc'){
  h='<h2>Controle de Acesso</h2><div class="box"><label for="vn">Nome do visitante</label><input id="vn" autocomplete="off"><label for="vt">Tipo</label><select id="vt"><option>Visita</option><option>Prestador de serviço</option><option>Entrega</option></select><label for="vd">Data e hora</label><input id="vd" placeholder="Ex.: Sábado, 14h"><button class="gold" data-act="addvis">Liberar entrada</button></div>';
  return h+D.vis.map(function(v){return box(esc(v.n),esc(v.t)+' • '+esc(v.d),'Liberado')}).join('');
 }
 if(s==='faq')return '<h2>Dúvidas Frequentes</h2><details><summary>Como reservo o salão de festas?</summary><p>Solicite pela administração com pelo menos 7 dias de antecedência.</p></details><details><summary>Qual o horário de silêncio?</summary><p>Das 22h às 8h em dias úteis.</p></details><details><summary>Posso receber visitas à noite?</summary><p>Sim. Libere o nome em Controle de Acesso antes da chegada.</p></details><details><summary>Como falo com a administração?</summary><p>Pela Ouvidoria, neste aplicativo.</p></details>';
 if(s==='ouv'){
  h='<h2>Ouvidoria</h2><div class="box"><label for="ot">Tipo</label><select id="ot"><option>Sugestão</option><option>Reclamação</option><option>Solicitação</option></select><label for="om">Mensagem</label><textarea id="om" rows="4"></textarea><button class="gold" data-act="addouv">Enviar mensagem</button></div>';
  return h+D.ouv.map(function(o){return box(esc(o.t),esc(o.m),'Enviada agora')}).join('');
 }
 if(s==='fin')return finView();
 if(s==='con')return conView();
 if(s==='fra')return fraView();
 if(s==='ale')return aleView();
 if(s==='tv')return tvView2();
 if(s==='ass')return assView();
 if(s==='tar')return tarView();
 if(s==='aud')return audView();
 if(s==='chpw')return chpwView();
 if(s==='age')return agView();
 if(s==='tar')return '<h2>Tarefas</h2><div class="box">'+D.tasks.map(function(t,i){return '<label class="chk"><input type="checkbox" data-task="'+i+'"'+(t.ok?' checked':'')+'><span'+(t.ok?' style="text-decoration:line-through;color:var(--mu)"':'')+'>'+esc(t.t)+'</span></label>'}).join('')+'</div>';
 if(s==='aud')return '<h2>Auditoria</h2>'+box('Acesso do administrador','Hoje, 08:12')+box('Comunicado publicado','Ontem, 17:40')+box('Alerta enviado (teste)','Há 3 dias');
 return '';
}
var F={items:[],dirty:false,form:false,msg:'',db:null};
function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function finView(){
 var r=0,d=0;F.items.forEach(function(i){if(i.t==='r')r+=i.v;else d+=i.v});
 var h='<h2>Finanças</h2><div class="box"><div class="stat"><span>Receitas</span><b style="color:#14573a">'+brl(r)+'</b></div><div class="stat"><span>Despesas</span><b style="color:#b3151b">'+brl(d)+'</b></div><div class="stat"><span>Saldo</span><b>'+brl(r-d)+'</b></div></div>';
 if(F.form)h+='<div class="box"><label for="ft">Tipo</label><select id="ft"><option value="d">Despesa</option><option value="r">Receita</option></select><label for="fd">Descrição</label><input id="fd" placeholder="Ex.: Troca de lâmpadas"><label for="fv">Valor (R$)</label><input id="fv" inputmode="decimal" placeholder="0,00"><button class="gold" data-act="fadd">Adicionar</button></div>';
 h+=F.items.length?F.items.map(function(i){return '<div class="box frow"><div><h4>'+esc(i.d)+'</h4><small>'+(i.t==='r'?'Receita':'Despesa')+' • '+esc(i.dt)+'</small></div><b style="color:'+(i.t==='r'?'#14573a':'#b3151b')+'">'+(i.t==='r'?'+ ':'− ')+brl(i.v)+'</b><button class="del" data-fdel="'+esc(i.id)+'" aria-label="Excluir">🗑</button></div>'}).join(''):'<p class="note">Nenhum lançamento. Toque em + para adicionar.</p>';
 h+='<button class="gold" data-act="fsave"'+(F.dirty?'':' style="opacity:.6"')+'>Salvar</button>'+(F.msg?'<p class="note">'+F.msg+'</p>':'');
 return h+'<button class="fab" data-act="ftoggle" aria-label="Adicionar lançamento">'+(F.form?'×':'+')+'</button>';
}
function fsave(){
 if(!F.db){try{localStorage.setItem('va_fin',JSON.stringify(F.items))}catch(e){}F.dirty=false;dlog('f',F.items);F.msg='Registro salvo neste aparelho.';render();return;}
 F.db.doc('financas/registro').set({items:F.items}).then(function(){F.dirty=false;dlog('f',F.items);F.msg='Registro salvo.';render()},function(){F.msg='Não foi possível salvar. Só administradores com acesso podem registrar.';render()});
}
(function(){
 try{var s=localStorage.getItem('va_fin');if(s)F.items=JSON.parse(s)}catch(e){}
 if(window.claude&&claude.use){claude.use('db').then(function(db){if(!db)return;F.db=db;db.doc('financas/registro').onSnapshot(function(snap){if(F.dirty)return;var x=snap.exists&&snap.data();if(x&&x.items){F.items=x.items;LS.f=x.items.slice();if(st.sc==='fin'&&!F.form)render()}},function(){})}).catch(function(){})}
})();
var P={items:[],dirty:false,form:false,msg:'',db:null};
function conView(){

function retroMusic2(ctx,dur){
 var t0=ctx.currentTime+0.2,master=ctx.createGain(),fin=Math.max(8,dur-22);
 master.gain.setValueAtTime(0,t0);master.gain.linearRampToValueAtTime(0.3,t0+4);master.gain.linearRampToValueAtTime(0.44,t0+fin);master.gain.setValueAtTime(0.44,t0+dur-5);master.gain.linearRampToValueAtTime(0,t0+dur);
 master.connect(ctx.destination);
 var len=ctx.sampleRate*3.5,buf=ctx.createBuffer(2,len,ctx.sampleRate);
 for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2)}
 var rv=ctx.createConvolver();rv.buffer=buf;var wet=ctx.createGain();wet.gain.value=0.7;rv.connect(wet);wet.connect(master);
 var dry=ctx.createGain();dry.gain.value=0.65;dry.connect(master);
 var bus=ctx.createGain();bus.connect(dry);bus.connect(rv);
 var CH=[[220,261.63,329.63,440,110],[174.61,220,261.63,349.23,87.31],[261.63,329.63,392,523.25,130.81],[196,246.94,293.66,392,98]];
 var MEL=[[659.25,587.33],[523.25,440],[659.25,783.99],[587.33,493.88]];
 var pat=[0,1,2,3,2,1,2,3],eighth=0.7,bar=5.6,bars=Math.ceil(dur/bar)+1;
 function tone(f,s,len,g1,type){var o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type=type;o.frequency.value=f;lp.type='lowpass';lp.frequency.value=2400;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(g1,s+0.03);g.gain.exponentialRampToValueAtTime(0.001,s+len);o.connect(lp);lp.connect(g);g.connect(bus);o.start(s);o.stop(s+len+0.1)}
 for(var b=0;b<bars;b++){
  var ch=CH[b%4],bt=t0+b*bar;
  [ch[4],ch[4]*2*1.004,ch[0]*1.003].forEach(function(f,k){var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,bt);g.gain.linearRampToValueAtTime(k===2?0.05:0.09,bt+1.8);g.gain.linearRampToValueAtTime(0,bt+bar+1);o.connect(g);g.connect(bus);o.start(bt);o.stop(bt+bar+1.2)});
  tone(ch[4],bt,4.5,0.2,'triangle');
  pat.forEach(function(p,i){tone(ch[p],bt+i*eighth,2.6,0.17,'triangle')});
  if(b>=1){var me=MEL[b%4];me.forEach(function(f,i){var s=bt+i*bar/2;tone(f,s,3.6,0.2,'sine');tone(f*2,s,2.2,0.04,'sine')})}
 }
 return master;
}

 else if(e.target.id==='pcode'){e.preventDefault();pCheck();render();}
});
(function(){
 if(!(window.claude&&claude.use))return;
 claude.use('db').then(function(db){
  if(!db)return;var role=window.ME&&window.ME.role;
  if(role==='portaria'||role==='adm'){
   db.collection('acessos').orderBy('ts','desc').limit(150).onSnapshot(function(sn){AC.all=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(['pacc','pval'].indexOf(st.sc)>-1||st.role==='por')render()},function(){});
   db.collection('chats').orderBy('ts','desc').limit(100).onSnapshot(function(sn){AC.chats=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(st.sc==='pchat'||st.role==='por')render()},function(){});
  }else if(role==='morador'){
   claude.use('user').then(function(u){return u&&u.id()}).then(function(uid){
    if(!uid)return;
    db.collection('acessos').where('uid','==',uid).onSnapshot(function(sn){AC.mine=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(st.sc==='acc')render()},function(){});
    db.doc('chats/'+uid).onSnapshot(function(sn){AC.myMeta=sn.exists?sn.data():null;if(st.sc==='acc'||st.sc==='mhome')render()},function(){});
    db.collection('chats/'+uid+'/msgs').orderBy('ts','asc').onSnapshot(function(sn){AC.msgs=sn.docs.map(function(d){return d.data()});var i=document.getElementById('rci');if(st.sc==='acc'&&!(i&&i.value))render();if(st.sc==='acc'&&AC.tab==='chat')markM()},function(){});
   });
  }
 }).catch(function(){});
})();

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail,deleteUser,updatePassword} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot,collection,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXgmOaeg8nxyQjG72s7WmRakAXJWut4Ag",
  authDomain: "vila-arboreto.firebaseapp.com",
  projectId: "vila-arboreto",
  storageBucket: "vila-arboreto.firebasestorage.app",
  messagingSenderId: "731063053283",
  appId: "1:731063053283:web:765bb1f9ae1ab700f14ed6"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fdb=getFirestore(app);

// Administradores (identificados pelo hash do e-mail; os e-mails ficam só em firestore.rules)
const ADMINS={'bdc34b2fc07b58f5e406f57e215aa45f71aea3102c704fa48407b37ba0393eba':'rodrigo','0cac9b3c8058d1903204f31bbdfdfb0ec0e88c0f8ff15d46213e7bcc7be274eb':'alessandra','735873acdcb5fc2a47cc6a387a9d3a2fa21203f6575902064fb5d4e22e5510c5':'admin'};
const PORT={'c2b08d2f3ac056103713f2afdef14ad62cc6c20d90b57f383a3c386301759485':'portaria'};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function snapD(s){return{exists:s.exists(),data:()=>s.data()}}
function mkdb(){
 function d(path){const r=doc(fdb,path);return{
  get:()=>getDoc(r).then(snapD),
  set:v=>setDoc(r,v),
  delete:()=>deleteDoc(r),
  onSnapshot:(cb,err)=>onSnapshot(r,s=>cb(snapD(s)),err||(()=>{}))}}
 function c(path,qs){const base=collection(fdb,path);return{
  orderBy:(f,dir)=>c(path,(qs||[]).concat([orderBy(f,dir)])),
  limit:n=>c(path,(qs||[]).concat([limit(n)])),
  where:(f,o,v)=>c(path,(qs||[]).concat([where(f,o,v)])),
  doc:id=>d(path+'/'+id),
  onSnapshot:(cb,err)=>onSnapshot(qs&&qs.length?query(base,...qs):base,sn=>cb({docs:sn.docs.map(x=>({id:x.id,data:()=>x.data()}))}),err||(()=>{}))}}
 return{doc:d,collection:p=>c(p)};
}
function mkdict(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
 let rec=null,act=false;const cb={p:[],f:[],s:[]};
 const st=x=>cb.s.forEach(f=>f({state:x}));
 return{active:()=>act,
  start:o=>new Promise(res=>{rec=new SR();rec.lang=(o&&o.language)||'pt-BR';rec.interimResults=true;rec.continuous=false;
   rec.onstart=()=>{act=true;st('listening');res()};
   rec.onresult=e=>{let t='',fin=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}(fin?cb.f:cb.p).forEach(f=>f({text:t}))};
   rec.onend=()=>{act=false;st('idle')};rec.onerror=()=>{act=false;st('idle')};
   rec.start()}),
  stop:()=>{try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
  onPartial:f=>cb.p.push(f),onFinal:f=>cb.f.push(f),onState:f=>cb.s.push(f)};
}
const api={
 db:mkdb(),
 dictation:mkdict(),
 user:{id:()=>Promise.resolve(auth.currentUser&&auth.currentUser.uid),
  profiles:async ids=>{const o={};for(const i of ids){try{const s=await getDoc(doc(fdb,'usuarios',i));o[i]={name:s.exists()?s.data().nome:''}}catch(e){o[i]={name:''}}}return o}}
};
window.__signout=()=>signOut(auth).then(()=>location.reload());
window.__changePw=async np=>{await updatePassword(auth.currentUser,np);try{localStorage.removeItem('va_mc_'+auth.currentUser.uid)}catch(e){}};

const gate=document.getElementById('gate');
let mode='load',door=null,msg='',busy=false,signing=false,started=false,pendingDefault=false,foto='',consent=false;const vals={};
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const S=280,c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};im.onerror=rej;im.src=url})}
function snap(){['ge','gn','ga','gb','gc'].forEach(i=>{const e=document.getElementById(i);if(e)vals[i]=e.value.trim()})}
function authMsg(e){const c=(e&&e.code)||'';
 if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Usuário ou senha incorretos.';
 if(c.includes('email-already-in-use'))return 'Este e-mail já tem conta. Toque em “Já tenho conta”.';
 if(c.includes('weak-password'))return 'A senha precisa ter pelo menos 6 caracteres.';
 if(c.includes('invalid-email'))return 'Esse e-mail não parece válido.';
 if(c.includes('too-many-requests'))return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
 if(c.includes('network'))return 'Sem conexão com a internet.';
 return 'Não foi possível concluir. Tente de novo.';}
function draw(){
 gate.hidden=false;let f='';
 const v=i=>E(vals[i]||'');
 if(mode==='load')f='<p class="gn">Carregando…</p>';
 else if(mode==='home')f=`<p class="gn" style="font-size:18px;margin:6px 0 14px">Como você quer entrar?</p><button class="gb" data-g="goadm">⚙️ Administração</button><button class="gb" data-g="gomor" style="margin-top:12px">👥 Moradores</button><button class="gb" data-g="gopor" style="margin-top:12px">🛂 Portaria</button>`;
 else if(mode==='adm')f=`<p class="gn" style="margin:0 0 4px">Administração</p><label for="ge">Usuário</label><input id="ge" type="text" autocapitalize="none" autocomplete="username" placeholder="Ex.: Alessandra" value="${v('ge')}"><label for="gp">Senha</label><input id="gp" type="password" autocomplete="current-password"><button class="gb" data-g="in"${busy?' disabled':''}>${busy?'Entrando…':'Entrar'}</button><button class="gl" data-g="home">‹ Voltar</button>`;
 else if(mode==='por')f=`<p class="gn" style="margin:0 0 4px">Portaria</p><label for="ge">Usuário</label><input id="ge" type="text" autocapitalize="none" autocomplete="username" placeholder="Portaria" value="${v('ge')}"><label for="gp">Senha</label><input id="gp" type="password" autocomplete="current-password"><button class="gb" data-g="in"${busy?' disabled':''}>${busy?'Entrando…':'Entrar'}</button><button class="gl" data-g="home">‹ Voltar</button>`;
 else if(mode==='morin')f=`<p class="gn" style="margin:0 0 4px">Moradores</p><label for="ge">E-mail</label><input id="ge" type="email" autocapitalize="none" autocomplete="email" value="${v('ge')}"><label for="gp">Senha</label><input id="gp" type="password" autocomplete="current-password"><button class="gb" data-g="in"${busy?' disabled':''}>${busy?'Entrando…':'Entrar'}</button><button class="gl" data-g="forgot">Esqueci minha senha</button><button class="gl" data-g="goreg">Primeiro acesso (cadastro)</button><button class="gl" data-g="home">‹ Voltar</button>`;
 else if(mode==='pending')f=`<p style="text-align:center;font-size:18px">⏳ Cadastro enviado!</p><p style="text-align:center">A administração vai conferir o seu nome, bloco e apartamento e liberar o acesso. Volte aqui depois para ver se já foi aprovado.</p><button class="gb" data-g="recheck">Verificar agora</button><button class="gl" data-g="out">Sair</button>`;
 else if(mode==='force')f=`<p style="text-align:center">Primeiro acesso: crie uma senha só sua. A senha padrão é fraca e não pode continuar.</p><label for="fp1">Nova senha (mínimo 8 caracteres)</label><input id="fp1" type="password" autocomplete="new-password"><label for="fp2">Repita a nova senha</label><input id="fp2" type="password" autocomplete="new-password"><button class="gb" data-g="force">Salvar nova senha</button><button class="gl" data-g="out">Sair</button>`;
 else f=`<p class="gn" style="margin:0 0 4px">Cadastro de morador</p><label for="gn">Nome completo</label><input id="gn" autocomplete="name" value="${v('gn')}"><label for="gb">Bloco</label><input id="gb" value="${v('gb')}" placeholder="Ex.: B"><label for="ga">Apartamento</label><input id="ga" value="${v('ga')}" placeholder="Ex.: 302"><label for="gc">Código do condomínio</label><input id="gc" autocomplete="off" value="${v('gc')}"><label for="ge">E-mail</label><input id="ge" type="email" autocomplete="email" value="${v('ge')}"><label for="gp">Crie uma senha (mínimo 6 caracteres)</label><input id="gp" type="password" autocomplete="new-password"><label for="gf">Selfie (foto do seu rosto)</label><input id="gf" type="file" accept="image/*" capture="user">${foto?`<img src="${foto}" alt="Sua foto" style="width:96px;height:96px;object-fit:cover;border-radius:12px;display:block;margin:8px auto">`:''}<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin-top:10px"><input id="gk" type="checkbox" style="width:20px;height:20px;flex:none;margin-top:2px"${consent?' checked':''}><span style="font-size:13px">Concordo em enviar minha foto à administração, só para confirmar quem sou. Ela fica visível apenas para a administração e é apagada quando o meu cadastro for aprovado.</span></label><button class="gb" data-g="reg">Criar minha conta</button><button class="gl" data-g="goin">Já tenho conta</button><button class="gl" data-g="home">‹ Voltar</button>`;
 gate.innerHTML=`<div class="gbox"><div class="gtop">🌳<div class="gv">VILA</div><div class="ga2">ARBORETO</div><small>CONDOMÍNIO</small></div><div class="gform">${f}${msg?`<p class="gm">${E(msg)}</p>`:''}</div></div>`;
}
function mustChange(u){try{if(pendingDefault)localStorage.setItem('va_mc_'+u.uid,'1');return !!localStorage.getItem('va_mc_'+u.uid)}catch(e){return pendingDefault}}
async function doForce(){
 const a=document.getElementById('fp1'),b=document.getElementById('fp2'),n=a?a.value:'',m2=b?b.value:'';
 if(n.length<8){msg='A senha precisa ter pelo menos 8 caracteres.';draw();return}
 if(n==='123456'||n==='12345678'){msg='Escolha uma senha menos óbvia.';draw();return}
 if(n!==m2){msg='As senhas não são iguais.';draw();return}
 try{await updatePassword(auth.currentUser,n);try{localStorage.removeItem('va_mc_'+auth.currentUser.uid)}catch(e){}pendingDefault=false;msg='';await proceed(auth.currentUser)}
 catch(e){msg='Não foi possível salvar a senha. Saia e entre de novo.';draw()}
}
const toEmail=t=>{t=(t||'').trim();if(t.includes('@'))return t;return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')+'@vila-arboreto.app'};
async function proceed(u){
 if(started)return;
 const em=(u.email||'').toLowerCase(),eh=await sha(em);let me=null;
 if(ADMINS[eh])me={role:'adm',id:ADMINS[eh]};
 else if(PORT[eh])me={role:'portaria',id:'portaria'};
 else{try{const s=await getDoc(doc(fdb,'usuarios',u.uid));if(s.exists()&&s.data().role==='morador')me={role:'morador',id:u.uid,nome:s.data().nome,apto:s.data().apto,status:s.data().status||''}}catch(e){}}
 if(!me){msg='Esta conta não tem acesso ao app. Moradores: use o primeiro acesso com o código do condomínio.';busy=false;mode=door==='adm'?'adm':door==='por'?'por':'morin';await signOut(auth);draw();return}
 if(me.role==='morador'&&me.status!=='aprovado'){busy=false;mode='pending';await draw();return}
 if(door==='adm'&&me.role!=='adm'){msg='Esta conta não é da administração. Volte e escolha a porta certa.';busy=false;mode='adm';await signOut(auth);draw();return}
 if(door==='por'&&me.role!=='portaria'){msg='Esta conta não é da portaria. Volte e escolha a porta certa.';busy=false;mode='por';await signOut(auth);draw();return}
 if(door==='mor'&&me.role!=='morador'){msg='Esta conta não é de morador. Volte e escolha a porta certa.';busy=false;mode='morin';await signOut(auth);draw();return}
 if(me.role!=='morador'&&mustChange(u)){mode='force';msg='';busy=false;draw();return}
 started=true;gate.hidden=true;window.ME=me;
 if(window.__onMe)window.__onMe(me);
 window.__fbres(api);
}
async function doIn(){
 const raw=vals.ge||'',pe=document.getElementById('gp'),pw=pe?pe.value:'';
 door=mode==='adm'?'adm':mode==='por'?'por':'mor';
 if(!raw||!pw){msg=(door==='adm'||door==='por')?'Digite o usuário e a senha.':'Digite o e-mail e a senha.';draw();return}
 if(door==='mor'&&!raw.includes('@')){msg='Moradores entram com o e-mail do cadastro.';draw();return}
 const em=toEmail(raw);
 pendingDefault=(pw==='123456');busy=true;msg='';draw();
 try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){pendingDefault=false;msg=authMsg(e);busy=false;draw()}
}
async function doReg(){
 const nome=vals.gn||'',bloco=vals.gb||'',apt=vals.ga||'',apto='Bloco '+bloco+', Apto '+apt,cod=vals.gc||'',em=vals.ge||'',pe=document.getElementById('gp'),pw=pe?pe.value:'';
 if(!nome||!bloco||!apt||!cod||!em||pw.length<6){msg='Preencha todos os campos. A senha precisa de pelo menos 6 caracteres.';draw();return}
 if(!foto){msg='Tire uma selfie para continuar.';draw();return}
 if(!consent){msg='Marque a autorização para enviar a foto.';draw();return}
 door='mor';signing=true;msg='';
 try{
  const cr=await createUserWithEmailAndPassword(auth,em,pw);
  try{await setDoc(doc(fdb,'usuarios',cr.user.uid),{nome,apto,role:'morador',codigo:cod,status:'pendente',foto})}
  catch(e){try{await deleteUser(cr.user)}catch(x){}signing=false;msg='Código do condomínio incorreto.';draw();return}
  signing=false;foto='';consent=false;await proceed(cr.user);
 }catch(e){signing=false;msg=authMsg(e);draw()}
}
async function doForgot(){
 const em=vals.ge||'';
 if(!em||!em.includes('@')){msg='Digite o seu e-mail acima e toque de novo.';draw();return}
 try{await sendPasswordResetEmail(auth,em)}catch(e){}
 msg='Se esse e-mail tiver conta, enviamos o link para criar uma nova senha.';draw();
}
gate.addEventListener('click',async e=>{
 const b=e.target.closest('[data-g]');if(!b)return;snap();const a=b.dataset.g;
 if(a==='goreg'){mode='morreg';msg='';draw()}
 else if(a==='goin'||a==='gomor'){mode='morin';msg='';draw()}
 else if(a==='goadm'){mode='adm';msg='';draw()}
 else if(a==='gopor'){mode='por';msg='';draw()}
 else if(a==='home'){mode='home';msg='';draw()}
 else if(a==='in')await doIn();
 else if(a==='reg')await doReg();
 else if(a==='forgot')await doForgot();
 else if(a==='force')await doForce();
 else if(a==='recheck'){msg='Ainda aguardando aprovação da administração.';await proceed(auth.currentUser)}
 else if(a==='out')await signOut(auth).then(()=>location.reload());
});
gate.addEventListener('change',async e=>{
 if(e.target.id==='gf'&&e.target.files&&e.target.files[0]){snap();try{foto=await shrink(e.target.files[0]);msg=''}catch(x){msg='Não foi possível ler a foto. Tente de novo.'}draw()}
 else if(e.target.id==='gk'){consent=e.target.checked}
});
gate.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fp2'){e.preventDefault();doForce();return}
 if(e.key==='Enter'&&e.target.id==='gp'){e.preventDefault();snap();(mode==='adm'||mode==='por'||mode==='morin'?doIn:doReg)()}});
onAuthStateChanged(auth,async u=>{
 if(signing)return;
 if(!u){if(mode==='load')mode='home';draw();return}
 await proceed(u);
});
